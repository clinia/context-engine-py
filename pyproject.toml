[project]
name = "clinia-context-engine"
version = "0.9.0"
description = "Python client for the Clinia Context Engine API"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Clinia Health Inc." }]
keywords = ["clinia", "context-engine", "healthcare", "fhir", "llm", "agent", "mcp", "openapi", "api-client"]
requires-python = ">=3.10"
# No `License ::` classifier: PEP 639 forbids one alongside the `license` expression,
# and PyPI rejects the upload.
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://www.clinia.com"
Documentation = "https://docs.clinia.com"
Changelog = "https://docs.clinia.com/changelog"
Source = "https://github.com/clinia/context-engine-py"
Issues = "https://github.com/clinia/context-engine-py/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.22",
  "pyright>=1.1.390",
  "ruff>=0.8",
  "datamodel-code-generator>=0.78",
  "twine>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinia_context_engine"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Generated models keep spec-ordered fields; import sorting still applies.
# RUF001-003: descriptions are the spec's prose, typography included.
per-file-ignores = { "src/clinia_context_engine/generated/*" = ["E501", "RUF001", "RUF002", "RUF003"] }

[tool.pyright]
include = ["src", "tests", "examples"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
